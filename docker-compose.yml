services:
  stk-server:
    build: .
    image: stk-server
    restart: unless-stopped
    volumes:
      - ./server_config.xml:/stk/server_config.xml
      - ./stk/supertuxkart:/stk/supertuxkart
      - ./stk/stkservers.db:/stk/stkservers.db
      - ./motd.txt:/stk/motd.txt
    environment:
      USERNAME: "your_stk_username"
      PASSWORD: "your_stk_password"
      #AI_KARTS: 1
    ports:
      - "2757:2757/udp"
      - "2759:2759/udp"
    networks:
      - stk-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "nc", "-z", "-u", "localhost", "2759"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

networks:
  stk-network:
    enable_ipv6: true
